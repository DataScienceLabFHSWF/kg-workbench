name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks CLI
        run: |
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan all fetched Git history with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --log-opts="--all"'

  javascript-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # GHSA-vfj7-8cjw-p6xm has no released upstream fix yet. Keep every other
      # high-severity finding blocking while this specific advisory is unfixable.
      - run: pnpm audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm

  python-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.7"
          python-version: "3.13"
          enable-cache: true
      - name: Export locked dependencies for auditing
        run: uv export --project services/internal-extractor --locked --no-emit-project --format requirements-txt --output-file "$RUNNER_TEMP/extractor-requirements.txt"
      - name: Audit the locked dependency set
        # NLTK 3.10.3 is transitively required by neo4j-graphrag. The affected
        # model-artifact path APIs are not used by the extractor, and no patched
        # NLTK release exists yet. Remove this exception when NLTK 3.10.4 ships.
        run: uvx pip-audit --require-hashes --no-deps --ignore-vuln PYSEC-2026-3740 -r "$RUNNER_TEMP/extractor-requirements.txt"
