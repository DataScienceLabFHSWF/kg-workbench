name: kg-workbench

services:
  app:
    container_name: kg-workbench
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      extraction:
        condition: service_started
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-none}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      EXTRACTION_API_URL: ${EXTRACTION_API_URL:-}
      INTERNAL_EXTRACTION_API_URL: ${INTERNAL_EXTRACTION_API_URL:-http://extraction:8000}
      APP_PASSWORD_PROTECTION_ENABLED: ${APP_PASSWORD_PROTECTION_ENABLED:-false}
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_ACCESS_GROUPS: ${APP_ACCESS_GROUPS:-}
      NEXT_PUBLIC_USE_MOCKS: ${NEXT_PUBLIC_USE_MOCKS:-true}
    ports:
      - 127.0.0.1:${APP_PORT:-3010}:3000
    networks:
      default:
      app_web:
        aliases:
          - kg-workbench

  extraction:
    container_name: kg-workbench-internal-extractor
    build:
      context: ../services/internal-extractor
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    ports:
      - 127.0.0.1:${INTERNAL_EXTRACTION_PORT:-8010}:8000
    extra_hosts:
      - host.docker.internal:host-gateway

networks:
  app_web:
    external: true
